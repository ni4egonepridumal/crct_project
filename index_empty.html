<!-- <!DOCTYPE> определяет, какую версию (X)HTML использует страница.

В прошлом, доктайпы должны были выступать в качестве ссылки на набор правил, 
которым HTML страница должна была следовать, чтобы считаться хорошим HTML, 
что могло означать автоматическую проверку ошибок и другие полезные вещи 

Однако в наши дни, это просто исторический артефакт, 
который должен быть включён для того, что бы все работало правильно.
-->
<!DOCTYPE html>
<!-- Элемент <html> называется корневым элементом -->
<!-- Атрибут — это дополнительная информация внутри открывающего тега, которая настраивает поведение или свойства элемента. -->
<!-- атрибут lang определяет язык -->
<!-- "ru" — значение атрибута -->

<!-- элемент <head>. Этот элемент выступает в качестве контейнера для всего, что вы пожелаете включить на HTML страницу, 
но не являющегося контентом, который вы показываете пользователям вашей страницы. 
К ним относятся такие вещи, как ключевые слова и описание страницы, которые будут появляться в результатах поиска, 
CSS стили нашего контента, кодировка и многое другое. -->

<!-- <meta charset="utf-8"> — этот элемент устанавливает UTF-8 кодировку вашего документа, 
 которая включает в себя большинство символов из всех известных человечеству языков. 
 По сути, теперь документ может обрабатывать любой текстовый контент, который вы в него вложите. 
 -->

<!-- Тег <meta name="viewport"> говорит браузеру, как правильно отображать страницу на мобильных устройствах (телефонах, планшетах). -->
<!-- width=device-width - "Ширина области просмотра должна быть равна ширине экрана устройства". -->
<!-- initial-scale=1.0 - "Масштаб при загрузке страницы должен быть равен 100%" -->

<!-- <title></title> — элемент <title>. Этот элемент устанавливает заголовок для вашей страницы, 
который является названием, появляющимся на вкладке браузера загружаемой страницы, и используется для описания страницы, 
когда вы добавляете её в закладки/избранное. -->

<!-- <body></body> — элемент <body>. В нем содержится весь контент, 
который вы хотите показывать пользователям, когда они посещают вашу страницу, будь то текст, 
изображения, видео, игры, проигрываемые аудиодорожки или что-то ещё. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой первый сайт</title>
  </head>
  <body>
    <div>Текст див</div>
    <span>Текс спан</span>
  </body>
</html>
